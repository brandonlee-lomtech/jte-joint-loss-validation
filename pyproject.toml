[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jlref"
version = "0.1.0"
description = "Minimal reference solver for the ADB Quantum Joint-Loss Challenge two-country scenarios (evaluation use only; see LICENSE)"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "scipy>=1.12,<2"]
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
